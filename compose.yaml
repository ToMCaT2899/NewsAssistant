name: news-assistant

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  target: base
  pull: false
  network: none
  args:
    PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim-bookworm}

services:
  check:
    build: *app-build
    image: news-assistant:local
    pull_policy: never
    init: true
    read_only: true
    tmpfs:
      - /tmp
    network_mode: none
    command: ["python", "scripts/check_design.py"]
    restart: "no"

  db-init:
    profiles: ["tools"]
    build: *app-build
    image: news-assistant:local
    pull_policy: never
    init: true
    read_only: true
    tmpfs:
      - /tmp
    network_mode: none
    volumes:
      - news-data:/app/data
    command: ["python", "scripts/init_db.py", "--database", "/app/data/news_assistant.db"]
    restart: "no"

volumes:
  news-data:
