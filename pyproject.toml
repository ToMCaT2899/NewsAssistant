[project]
name = "news-assistant"
version = "0.1.0"
description = "Design and scaffolding for a daily AI news assistant"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]
