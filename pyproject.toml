[project]
name = "news-assistant"
version = "0.1.0"
description = "Design and scaffolding for a daily AI news assistant"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "email-validator>=2.4.0",
    "fastapi>=0.165.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "langgraph>=1.2.24",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.9",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
    "types-beautifulsoup4>=4.12.0.20250516",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
