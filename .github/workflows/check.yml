name: checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install uv==0.12.7
      - run: uv sync --locked
      - run: uv run ruff check backend scripts tests
      - run: uv run ruff format --check backend scripts tests
      - run: uv run mypy backend
      - run: uv run python scripts/check_design.py
      - run: uv run python -m pytest -q
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run format:check && npm run build
        working-directory: frontend
      - run: docker compose config --quiet
